{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Không tìm thấy trang | Keo Vữa Sông Hồng</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon-32x32.png' %}?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="{% static 'images/favicon-192.png' %}?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Bai Jamjuree', sans-serif;
            background: #ffffff;
            color: #0f172a;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .error-container {
            text-align: center;
            max-width: 580px;
            padding: 24px;
        }

        .error-code {
            font-size: clamp(110px, 20vw, 190px);
            font-weight: 800;
            line-height: 0.9;
            letter-spacing: -5px;
            background: linear-gradient(135deg, #FF7E2E 0%, #F56E1A 50%, #E85D08 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .error-title {
            font-size: clamp(22px, 3.5vw, 30px);
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 12px;
        }

        .error-desc {
            font-size: 16px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .error-btns {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #FF7E2E 0%, #E85D08 100%);
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 4px 16px rgba(232, 93, 8, 0.28);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(232, 93, 8, 0.4);
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f8fafc;
            color: #475569;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
            border: 1px solid #cbd5e1;
            transition: all 0.2s;
            cursor: pointer;
        }

        .btn-back:hover {
            background: #f1f5f9;
            color: #0f172a;
            border-color: #94a3b8;
        }

        @media (max-width: 480px) {
            .error-btns {
                flex-direction: column;
                width: 100%;
            }
            .btn-home, .btn-back {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Không tìm thấy trang</h1>
        <p class="error-desc">Trang bạn đang tìm kiếm không tồn tại hoặc đã được chuyển sang địa chỉ khác.</p>
        <div class="error-btns">
            <a href="{% url 'home' %}" class="btn-home">
                <i class="fas fa-house"></i> Về Trang Chủ
            </a>
            <button onclick="window.history.back()" class="btn-back">
                <i class="fas fa-arrow-left"></i> Quay lại
            </button>
        </div>
    </div>
</body>
</html>
