{% extends 'admin/base.html' %}
{% load i18n static unfold %}

{% block title %}Hồ sơ cá nhân | SHK Mortar Admin{% endblock %}

{% block content %}
<div class="account-profile-page max-w-4xl mx-auto">
    <!-- Tiêu đề lớn góc trên -->
    <h1 class="account-page-title">Hồ sơ cá nhân</h1>

    {% if messages %}
    <div class="account-messages">
        {% for message in messages %}
        <div class="account-msg-alert {% if message.tags == 'error' %}msg-error{% else %}msg-success{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Khối form nhập liệu màu trắng viền xám theo mẫu -->
    <div class="account-form-card">
        <div class="account-form-grid">
            <div class="account-form-group" style="grid-column: 1 / -1;">
                <label class="account-form-label">Tài khoản</label>
                <input type="text" value="{{ request.user.username }}" readonly class="account-input account-input-disabled">
            </div>
            <div class="account-form-group" style="grid-column: 1 / -1;">
                <label class="account-form-label">Mật khẩu</label>
                <input type="password" value="********" readonly class="account-input account-input-disabled">
            </div>
        </div>

        <div class="account-form-actions">
            <a href="{% url 'admin:password_change' %}" class="account-save-btn" style="display:inline-block;text-decoration:none;">Đổi mật khẩu</a>
        </div>
    </div>
</div>
{% endblock %}
