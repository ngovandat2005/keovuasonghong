{% extends 'admin/base.html' %}
{% load i18n static unfold %}

{% block title %}Hồ sơ cá nhân | SHK Mortar Admin{% endblock %}

{% block content %}
<div class="account-profile-page max-w-4xl mx-auto">
    <!-- Tiêu đề lớn góc trên -->
    <h1 class="account-page-title">Hồ sơ cá nhân</h1>

    {% if messages %}
    <div class="account-messages">
        {% for message in messages %}
        <div class="account-msg-alert {% if message.tags == 'error' %}msg-error{% else %}msg-success{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Khối form nhập liệu màu trắng viền xám theo mẫu -->
    <div class="account-form-card">
        <form method="post" action="">
            {% csrf_token %}
            <input type="hidden" name="action" value="change_password">

            <div class="account-form-grid">
                <div class="account-form-group" style="grid-column: 1 / -1;">
                    <label class="account-form-label">Tài khoản</label>
                    <input type="text" value="{{ request.user.username }}" readonly class="account-input account-input-disabled">
                </div>

                <div class="account-form-group" style="grid-column: 1 / -1;">
                    <label class="account-form-label">Mật khẩu hiện tại<span class="required-star">*</span></label>
                    <input type="password" name="old_password" required autocomplete="current-password" class="account-input">
                </div>

                <div class="account-form-group">
                    <label class="account-form-label">Mật khẩu mới<span class="required-star">*</span></label>
                    <input type="password" name="new_password1" required autocomplete="new-password" class="account-input">
                </div>

                <div class="account-form-group">
                    <label class="account-form-label">Nhập lại mật khẩu mới<span class="required-star">*</span></label>
                    <input type="password" name="new_password2" required autocomplete="new-password" class="account-input">
                </div>
            </div>

            <div class="account-form-actions">
                <button type="submit" class="account-save-btn">Đổi mật khẩu</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
