<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" width="200" height="40">
  <defs>
    <linearGradient id="bctBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066CC" />
      <stop offset="100%" stop-color="#004C99" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Right Ribbon / Badge Rectangle -->
  <rect x="22" y="3" width="175" height="34" rx="3" fill="url(#bctBg)" filter="url(#shadow)" />
  
  <!-- Ribbon Notch / Edge Detail -->
  <path d="M 197 3 L 191 20 L 197 37 Z" fill="#003D7A" opacity="0.3"/>

  <!-- Texts -->
  <text x="110" y="18" fill="#FFFFFF" font-family="'Bai Jamjuree', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.4">ĐÃ THÔNG BÁO</text>
  <text x="110" y="30" fill="#FFFFFF" font-family="'Bai Jamjuree', 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle" letter-spacing="0.4">BỘ CÔNG THƯƠNG</text>
  
  <!-- Left Circular Seal -->
  <circle cx="20" cy="20" r="17" fill="#005CB8" stroke="#FFFFFF" stroke-width="1.8" filter="url(#shadow)"/>
  <circle cx="20" cy="20" r="14" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="0.75" stroke-dasharray="1.5,1"/>
  
  <!-- Checkmark -->
  <path d="M 12.5 19.5 L 17 24.5 L 28 13.5" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Arc Text: ONLINE.GOV.VN -->
  <path id="circleArc" d="M 7,20 A 13,13 0 0,1 33,20" fill="none"/>
  <text font-size="3.8" fill="#FFFFFF" font-family="'Bai Jamjuree', 'Segoe UI', sans-serif" font-weight="700" letter-spacing="0.4">
    <textPath href="#circleArc" startOffset="50%" text-anchor="middle">ONLINE.GOV.VN</textPath>
